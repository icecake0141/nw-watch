[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nw-watch"
version = "0.1.0"
description = "Dual-device network CLI monitor"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "netmiko>=4.3.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.44.0",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
    "aiofiles>=25.1.0",
    "croniter>=6.2.2",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "flake8>=7.3.0",
    "black>=26.3.1",
    "mypy>=1.0.0",
]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nw_watch*"]
exclude = ["tests*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
